<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 · 系统与接入</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./display.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="./manage.css" />
  <link rel="stylesheet" href="newlook.css" />
  <link rel="stylesheet" href="workbench.css" />
  <script>
    window.PAIGU_WEB = {};
  </script>
<script defer src="./common.js"></script>
  <script defer src="shell.js"></script>
  <script defer src="./manage.js"></script>
  <script defer src="./settings.js"></script>
</head>
<body data-page="settings">
  <div class="page">
    <header class="topbar app-topbar">
      <div class="shell-row">
        <a class="brand" href="index.html">
          <span class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l9-4 9 4-9 4-9-4z"/><path d="M3 7.5v9l9 4 9-4v-9"/><path d="M12 11.5v9"/></svg></span>
          <span class="brand-text"><b>设置 · 系统与接入</b><small>gateway / llm / display / members / 快照</small></span>
        </a>
        <nav class="stepper" id="wf-stepper" aria-label="工作流步骤"></nav>
        <div class="wf-status" id="wf-status"></div>
        <span class="spacer"></span>
        <label class="row tight">
          <span class="hint">API</span>
          <input id="api" size="26" />
        </label>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题"></button>
      </div>
      <div class="tools-row">
        <span id="rev-badge" class="status-badge">revision —</span>
        <span id="conn-badge" class="status-badge"><span class="dot"></span>未加载</span>
        <span class="spacer"></span>
        <button id="load" class="small">重新载入</button>
        <button id="reload" class="small">从磁盘重载</button>
        <button id="save" class="primary">保存配置</button>

      </div>
    </header>

    <div id="banner" class="banner"></div>

    <nav class="section-nav">
      <a href="#sec-gateway">接入</a>
      <a href="#sec-display">展示</a>
      <a href="#sec-llm">LLM</a>
      <a href="#sec-snapshot">快照</a>
    </nav>

    <div id="form" class="hidden">
      <div class="layout">
        <section class="panel admin-section" id="sec-gateway">
          <div class="panel-head"><span>NapCat 接入</span></div>
          <div class="panel-body">
            <label class="field"><span>监听地址</span><input id="gw-bind" /></label>
            <div class="split">
              <label class="field"><span>心跳间隔（秒）</span><input id="gw-heartbeat" type="number" min="1" /></label>
              <label class="field"><span>发送回复（真实群保持关闭）</span><input id="gw-reply" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>执行管理员命令</span><input id="gw-admincmds" type="checkbox" style="width:auto" /></label>
            </div>
            <label class="field"><span>接收群号（逗号分隔）</span><input id="gw-whitelist" /></label>
            <label class="field"><span>接收成员（逗号分隔；留空不限）</span><input id="gw-whitelist-members" /></label>
            <label class="field"><span>允许的只读动作（逗号分隔）</span><input id="gw-actions" /></label>
            <div class="row">
              <button id="gw-reply-toggle" class="small">切换回复开关</button>
              <button id="gw-admin-toggle" class="small">切换管理员命令</button>
              <span class="hint">立即生效；其他字段使用顶部保存。</span>
            </div>
          </div>
        </section>

        <section class="panel admin-section" id="sec-display">
          <div class="panel-head"><span>展示设置</span></div>
          <div class="panel-body">
            <div class="split">
              <label class="field"><span>刷新间隔（毫秒）</span><input id="dp-refresh" type="number" min="500" /></label>
              <label class="field"><span>数据来源</span>
                <select id="dp-source"><option value="local">local</option><option value="remote">remote</option></select>
              </label>
            </div>
            <label class="field"><span>远程快照地址</span><input id="dp-remote" placeholder="https://…/rounds/{round_id} 或 …/current.json" /></label>
          </div>
        </section>
      </div>

      <div class="layout" style="margin-top:12px">
        <section class="panel admin-section" id="sec-llm">
          <div class="panel-head"><span>消息理解</span></div>
          <div class="panel-body">
            <div class="split">
              <label class="field"><span>启用模型</span><input id="llm-enabled" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>失败时使用规则</span><input id="llm-fallback" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>服务地址</span><input id="llm-base" /></label>
              <label class="field"><span>模型名称</span><input id="llm-model" /></label>
              <label class="field"><span>密钥环境变量</span><input id="llm-keyenv" /></label>
              <label class="field"><span>超时（秒）</span><input id="llm-timeout" type="number" min="1" /></label>
              <label class="field"><span>最大输出长度</span><input id="llm-maxtokens" type="number" min="1" /></label>
              <label class="field"><span>随机度</span><input id="llm-temp" type="number" step="0.05" min="0" max="2" /></label>
            </div>
            <label class="field"><span>提示词</span><textarea id="llm-prompt" rows="12"></textarea></label>
          </div>
        </section>


      </div>

      <div class="layout" style="margin-top:12px">


        <section class="panel admin-section" id="sec-snapshot">
          <div class="panel-head"><span>私有备份与恢复</span></div>
          <div class="panel-body">
            <p class="hint">完整备份含成员、原消息与管理记录，只保存到本机路径，不用于公开分享。应用仅替换当前同一轮消息与审计，保留当前配置和订单草稿。</p>
            <div class="row">
              <label class="field" style="flex:1;margin:0"><span>out_dir（可选；留空用后端默认目录）</span><input id="snap-out" placeholder="例如 data/snapshots" /></label>
              <button id="snap-export" class="primary">保存完整私有备份</button>
            </div>
            <div class="hint" id="snap-export-info"></div>
            <hr style="border:none;border-top:1px solid var(--border);margin:10px 0" />
            <label class="field"><span>path（.snapshot.json 文件或目录）</span><input id="snap-path" placeholder="上一步导出返回的路径" /></label>
            <div class="row">
              <button id="snap-import" class="small">预检备份</button>
              <button id="snap-apply" class="danger" disabled>应用已预检备份</button>
            </div>
            <div id="snap-import-result" class="hint"></div>
          </div>
        </section>
      </div>
    </div>

    <div id="loading" class="empty">正在载入配置…</div>
  </div>
</body>
</html>
