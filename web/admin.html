<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>排谷管理面板</title>
  <link rel="stylesheet" href="display.css" />
  <script>
    window.PAIGU_WEB = { apiBase: "http://127.0.0.1:21081" };
  </script>
  <script defer src="common.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span class="brand">排谷管理面板</span>
      <span id="rev-badge" class="status-badge">revision —</span>
      <span id="conn-badge" class="status-badge"><span class="dot"></span>未加载</span>
      <span class="spacer"></span>
      <label class="row tight">
        <span class="hint">API</span>
        <input id="api" size="26" />
      </label>
      <button id="load" class="small">重新载入</button>
      <button id="reload" class="small">从磁盘重载</button>
      <button id="save" class="primary">保存配置</button>
      <span class="nav-links">
        <a href="index.html">首页</a>
        <a href="display.html">展示</a>
        <a href="sim.html">模拟器</a>
      </span>
    </div>

    <div id="banner" class="banner"></div>

    <div id="form" class="hidden">
      <div class="layout">
        <section class="panel">
          <div class="panel-head"><span>接入（gateway）</span></div>
          <div class="panel-body">
            <label class="field"><span>bind</span><input id="gw-bind" /></label>
            <div class="split">
              <label class="field"><span>heartbeat_secs</span><input id="gw-heartbeat" type="number" min="1" /></label>
              <label class="field"><span>require_token</span><input id="gw-require-token" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>reply_enabled（真实群必须关闭）</span><input id="gw-reply" type="checkbox" style="width:auto" /></label>
            </div>
            <label class="field"><span>whitelist_groups（逗号分隔）</span><input id="gw-whitelist" /></label>
            <label class="field"><span>allowed_actions（逗号分隔，禁止 send_*）</span><input id="gw-actions" /></label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head"><span>展示（display）</span></div>
          <div class="panel-body">
            <div class="split">
              <label class="field"><span>refresh_ms</span><input id="dp-refresh" type="number" min="500" /></label>
              <label class="field"><span>data_source</span>
                <select id="dp-source"><option value="local">local</option><option value="remote">remote</option></select>
              </label>
            </div>
            <label class="field"><span>remote_base_url</span><input id="dp-remote" placeholder="https://…/rounds/{round_id} 或 …/current.json" /></label>
          </div>
        </section>
      </div>

      <div class="layout" style="margin-top:12px">
        <section class="panel">
          <div class="panel-head"><span>LLM（llm）</span></div>
          <div class="panel-body">
            <div class="split">
              <label class="field"><span>enabled</span><input id="llm-enabled" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>fallback_to_rules</span><input id="llm-fallback" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>base_url</span><input id="llm-base" /></label>
              <label class="field"><span>model</span><input id="llm-model" /></label>
              <label class="field"><span>api_key_env</span><input id="llm-keyenv" /></label>
              <label class="field"><span>timeout_secs</span><input id="llm-timeout" type="number" min="1" /></label>
              <label class="field"><span>max_tokens</span><input id="llm-maxtokens" type="number" min="1" /></label>
              <label class="field"><span>temperature</span><input id="llm-temp" type="number" step="0.05" min="0" max="2" /></label>
            </div>
            <label class="field"><span>prompt_template</span><textarea id="llm-prompt" rows="12"></textarea></label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head"><span>成员（members）</span></div>
          <div class="panel-body">
            <div class="split">
              <label class="field"><span>group_id</span><input id="mb-group" /></label>
              <label class="field"><span>cache_path</span><input id="mb-cache" /></label>
              <label class="field"><span>daily_pull_at</span><input id="mb-pull" placeholder="19:00" /></label>
            </div>
            <div class="row">
              <button id="members-refresh" class="small">拉取群成员</button>
              <span id="members-info" class="hint"></span>
            </div>
            <div style="max-height:34vh;overflow:auto;margin-top:8px">
              <table class="grid">
                <thead><tr><th>user_id</th><th>昵称（清洗后）</th><th>原始</th><th>角色</th></tr></thead>
                <tbody id="members-body"></tbody>
              </table>
              <div id="members-empty" class="empty">尚未加载成员列表</div>
            </div>
          </div>
        </section>
      </div>

      <section class="panel" style="margin-top:12px">
        <div class="panel-head">
          <span>轮次与商品（round）</span>
          <span class="spacer"></span>
          <button id="item-add" class="small">添加商品</button>
        </div>
        <div class="panel-body">
          <div class="split">
            <label class="field"><span>round_id</span><input id="rd-id" /></label>
            <label class="field"><span>title</span><input id="rd-title" /></label>
            <label class="field"><span>group_id</span><input id="rd-group" /></label>
          </div>
          <label class="field"><span>priority_users（预存用户，逗号分隔）</span><input id="rd-priority" /></label>
          <div class="split">
            <label class="field"><span>priority_window.start（本地时间）</span><input id="rd-start" type="datetime-local" /></label>
            <label class="field"><span>priority_window.end（独占，本地时间）</span><input id="rd-end" type="datetime-local" /></label>
          </div>
          <div class="hint" id="rd-window-ms"></div>
          <div id="items"></div>
        </div>
      </section>
    </div>

    <div id="loading" class="empty">正在载入配置…</div>
  </div>
</body>
</html>
