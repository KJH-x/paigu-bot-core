<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>排谷展示</title>
  <link rel="stylesheet" href="display.css" />
  <script>
    window.PAIGU_WEB = { apiBase: "http://127.0.0.1:21081", remoteBaseUrl: "", refreshMs: 5000 };
  </script>
  <script defer src="common.js"></script>
  <script defer src="display.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span class="brand">排谷展示</span>
      <span id="round-title" class="meta"></span>
      <span id="conn-badge" class="status-badge"><span class="dot"></span>连接中…</span>
      <span id="version-badge" class="status-badge">版本 —</span>
      <span class="spacer"></span>
      <label class="row tight">
        <span class="hint">数据源</span>
        <select id="source">
          <option value="local">local · 本机 API</option>
          <option value="remote">remote · 静态快照</option>
        </select>
      </label>
      <label class="row tight" id="api-wrap">
        <span class="hint">API</span>
        <input id="api" size="26" placeholder="http://127.0.0.1:21081" />
      </label>
      <label class="row tight hidden" id="remote-wrap">
        <span class="hint">Remote</span>
        <input id="remote" size="26" placeholder="https://…/rounds/xxx" />
      </label>
      <button id="refresh" class="small">立即刷新</button>
      <span class="nav-links">
        <a href="index.html">首页</a>
        <a href="admin.html">管理</a>
        <a href="sim.html">模拟器</a>
      </span>
    </div>

    <div id="banner" class="banner"></div>

    <div class="layout">
      <section class="panel">
        <div class="panel-head">
          <span>排位表</span>
          <span id="board-count" class="hint"></span>
          <span class="spacer"></span>
          <span id="board-updated" class="hint"></span>
        </div>
        <div class="panel-body">
          <div id="board" class="board"></div>
          <div id="board-empty" class="empty">暂无排位数据</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <span>消息流</span>
          <span id="msg-count" class="hint"></span>
          <span class="spacer"></span>
          <span class="hint">仅在贴近底部时自动跟随</span>
        </div>
        <div class="panel-body flush">
          <div id="messages" class="messages"></div>
          <button id="new-content" class="new-content" hidden></button>
        </div>
      </section>
    </div>

    <div class="layout" style="margin-top:12px">
      <section class="panel">
        <div class="panel-head"><span>Who-Whats</span><span id="ww-count" class="hint"></span></div>
        <div class="panel-body flush" style="max-height:40vh;overflow:auto">
          <table class="who-whats">
            <thead><tr><th>display</th><th>身份</th><th>明细</th></tr></thead>
            <tbody id="who-whats"></tbody>
          </table>
          <div id="ww-empty" class="empty">暂无认领记录</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span>状态</span><span class="spacer"></span><span id="poll-info" class="hint"></span></div>
        <div class="panel-body">
          <div id="status" class="kv"></div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
