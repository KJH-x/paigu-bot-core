<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>排谷模拟器</title>
  <link rel="stylesheet" href="display.css" />
  <script>
    window.PAIGU_WEB = { apiBase: "http://127.0.0.1:21081", refreshMs: 3000 };
  </script>
  <script defer src="common.js"></script>
  <script defer src="sim.js"></script>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span class="brand">排谷模拟器</span>
      <span id="conn-badge" class="status-badge"><span class="dot"></span>未连接</span>
      <span id="ws-badge" class="status-badge"><span class="dot"></span>WS 未连接</span>
      <span id="version-badge" class="status-badge">版本 —</span>
      <span class="spacer"></span>
      <label class="row tight">
        <span class="hint">API</span>
        <input id="api" size="24" />
      </label>
      <label class="row tight">
        <span class="hint">WS</span>
        <input id="ws" size="24" />
      </label>
      <button id="ws-reconnect" class="small">重连 WS</button>
      <button id="reset" class="danger small">重置模拟会话</button>
      <span class="nav-links">
        <a href="index.html">首页</a>
        <a href="display.html">展示</a>
        <a href="admin.html">管理</a>
      </span>
    </div>

    <div id="banner" class="banner"></div>

    <div class="layout">
      <section class="panel">
        <div class="panel-head"><span>模拟发送</span><span class="spacer"></span><span id="identity-info" class="hint"></span></div>
        <div class="panel-body">
          <div class="split">
            <label class="field"><span>身份（占位身份，禁止真实昵称）</span>
              <select id="identity-select"></select>
            </label>
            <label class="field"><span>群号（可选）</span>
              <input id="group" placeholder="123456789" />
            </label>
          </div>

          <div id="identity-custom" class="hidden">
            <div class="split">
              <label class="field"><span>user_id</span><input id="c-user" placeholder="成员06" /></label>
              <label class="field"><span>nickname（占位名）</span><input id="c-nick" placeholder="成员06" /></label>
              <label class="field"><span>is_admin</span><input id="c-admin" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>是否预存（priority）</span><input id="c-priority" type="checkbox" style="width:auto" /></label>
              <label class="field"><span>priority_level</span><input id="c-level" type="number" value="10" /></label>
            </div>
            <button id="identity-apply" class="small">应用自定义身份</button>
          </div>

          <label class="field" style="margin-top:8px">
            <span>时间偏移 ±DD HH MM SS（只影响该消息 timestamp_ms，不改变服务器时间）</span>
            <div class="row">
              <input id="offset" value="+00 00 00 00" style="width:180px" />
              <span id="offset-hint" class="hint"></span>
            </div>
          </label>

          <label class="field"><span>消息内容</span><textarea id="text" rows="3" placeholder="例如：排通行证SP结城理1"></textarea></label>

          <div class="row">
            <button id="send" class="primary">发送</button>
            <span id="send-hint" class="hint"></span>
          </div>
          <div id="ws-replies" class="hint" style="margin-top:6px"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><span>实时排位</span><span class="spacer"></span><span id="board-count" class="hint"></span></div>
        <div class="panel-body" style="max-height:70vh;overflow:auto">
          <div id="board" class="board"></div>
          <div id="board-empty" class="empty">暂无排位数据</div>
        </div>
      </section>
    </div>

    <section class="panel" style="margin-top:12px">
      <div class="panel-head"><span>转录</span><span id="turn-count" class="hint"></span></div>
      <div class="panel-body flush">
        <div id="transcript" class="transcript"></div>
        <div id="transcript-empty" class="empty">尚无消息</div>
      </div>
    </section>
  </div>
</body>
</html>
