<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开团 · 轮次与商品</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./display.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="./manage.css" />
  <link rel="stylesheet" href="newlook.css" />
  <link rel="stylesheet" href="workbench.css" />
  <script>
    window.PAIGU_WEB = {};
  </script>
  <script defer src="./vendor/pinyin-pro.js"></script>
<script defer src="./common.js"></script>
  <script defer src="shell.js"></script>
  <script defer src="./manage.js"></script>
  <script defer src="./round.js"></script>
</head>
<body data-page="round">
  <div class="page">
    <header class="topbar app-topbar">
      <div class="shell-row">
        <a class="brand" href="index.html">
          <span class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l9-4 9 4-9 4-9-4z"/><path d="M3 7.5v9l9 4 9-4v-9"/><path d="M12 11.5v9"/></svg></span>
          <span class="brand-text"><b>开团 · 轮次与商品</b><small>工作流向导 · ① 开团</small></span>
        </a>
        <nav class="stepper" id="wf-stepper" aria-label="工作流步骤"></nav>
        <div class="wf-status" id="wf-status"></div>
        <span class="spacer"></span>
        <label class="row tight">
          <span class="hint">API</span>
          <input id="api" size="26" />
        </label>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="切换主题"></button>
      </div>
      <div class="tools-row">
        <span id="rev-badge" class="status-badge">revision —</span>
        <span id="conn-badge" class="status-badge"><span class="dot"></span>未加载</span>
        <span class="spacer"></span>
        <button id="load" class="small">重新载入</button>
        <button id="reload" class="small">从磁盘重载</button>
        <button id="save" class="primary">保存配置</button>

      </div>
    </header>

    <div id="banner" class="banner"></div>

    <nav class="section-nav">
      <a href="#sec-rounds">轮次管理</a>
      <a href="#sec-round-basic">轮次设置</a>
      <a href="#sec-phases">阶段时间窗</a>
      <a href="#sec-items">商品目录</a>
    </nav>

    <div id="form" class="hidden">
      <span id="sec-round" aria-hidden="true"></span>
      <section class="panel admin-section" id="sec-rounds">
        <div class="panel-head">
          <span>轮次管理</span>
          <span class="spacer"></span>
          <span id="rounds-info" class="hint"></span>
          <button id="rounds-refresh" class="small">刷新轮次</button>
        </div>
        <div class="panel-body">

          <div class="new-round" style="margin-top:10px">
            <label class="field"><span>轮次编号</span><input id="rd-new-id" placeholder="例如 新团-2026" /></label>
            <label class="field"><span>轮次名称</span><input id="rd-new-title" placeholder="留空使用编号" /></label>
            <label class="field"><span>复制已有轮次</span><select id="rd-new-copy"><option value="">不复制</option></select></label>
            <button id="rd-new-btn" class="primary">新建轮次</button>
          </div>


          <div id="rounds-list" class="round-list" style="margin-top:8px"></div>
          <div id="rounds-empty" class="empty">尚未加载轮次</div>
          <div id="round-check"></div>
        </div>
      </section>

      <section class="panel admin-section" id="sec-round-basic" style="margin-top:12px">
        <div class="panel-head">
          <span>当前激活轮次设置</span>
          <span class="spacer"></span>
          <span id="rd-active-info" class="hidden"></span>
        </div>
        <div class="panel-body">
          <div class="split">
            <label class="field hidden"><span>轮次编号</span><input id="rd-id" readonly /></label>
            <label class="field"><span>轮次名称</span><input id="rd-title" /></label>
            <label class="field"><span>群号</span><input id="rd-group" /></label>
          </div>
          <label class="field"><span>预存成员</span><input id="rd-priority" /></label>
          <div class="split">
            <label class="field"><span>优先开始</span><input id="rd-start" type="datetime-local" /></label>
            <label class="field"><span>优先结束</span><input id="rd-end" type="datetime-local" /></label>
          </div>
          <div class="hint" id="rd-window-ms"></div>
        </div>
      </section>

      <section class="panel admin-section" id="sec-phases" style="margin-top:12px">
        <div class="panel-head">
          <span>阶段管理</span>
          <span class="spacer"></span>
          <button id="phase-add" class="small">添加阶段</button>
        </div>
        <div class="panel-body">
          <div class="hint">按本地时间设置阶段；留空不限制。</div>
          <div id="phases" style="margin-top:8px"></div>
        </div>
      </section>

      <section class="panel admin-section" id="sec-items" style="margin-top:12px">
        <div class="panel-head">
          <span>商品目录（种类：拼团 / 单领 / 整盒 / 特典）</span>
          <span class="spacer"></span>
          <span id="alias-llm-status" class="status-inline"></span>
          <button id="alias-llm-btn" class="small">别名 LLM 建议</button>
          <button id="item-add" class="small">添加商品</button>
        </div>
        <div class="panel-body">
          <div id="kind-tabs" class="kind-tabs" style="margin-top:8px"></div>
          <input id="item-filter" type="search" placeholder="筛选商品 / 别名 / 子项 / 拼音（全拼或首字母）" style="width:100%;margin:6px 0" />
          <div id="items" class="cat-list"></div>
          <div id="item-add-end" class="dashed add-end" role="button" tabindex="0">＋ 添加商品（选择种类后添加）</div>
        </div>
      </section>
    </div>

    <div id="loading" class="empty">正在载入配置…</div>
  </div>
</body>
</html>
